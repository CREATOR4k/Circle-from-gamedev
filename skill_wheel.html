<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Колесо навыков</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>⚔ Колесо навыков</h1>

<div id="selector-row">
  <label for="selector">Вариант персонажа:</label>
  <select id="selector" onchange="changeOption()"></select>
  <div id="points-row">
    <span>Очки:</span>
    <span id="points-val">5</span>
    <button id="reset-btn" onclick="resetSkills()">Сбросить</button>
  </div>
</div>
<div id="wheel-area">
     <div id="canvas-wrap">
       <canvas id="skillWheel" width="800" height="800"></canvas>
      </div>
      <div id="info-panel">
        <div id="infoTitle">Выберите навык</div>
          <div id="infoType">Наведите или нажмите на сектор</div>
            <div id="infoDesc">Здесь будет отображено описание выбранного умения, а также требования для его получения.</div>
      </div>
</div>

<script src="script.js"></script>
</body>
</html>
