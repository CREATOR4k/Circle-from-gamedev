<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо Навыков — Heroes 5 Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>КОЛЕСО НАВЫКОВ</h1>
    <!-- <p style="color: #8a775d; margin-top: 0;">Нажимайте на сектора, чтобы изучать навыки</p> -->

   <div class="main">
        <canvas id="skillWheel" width="800" height="800"></canvas>

        <div class="info-panel">
            <h2 id="infoTitle" class="info-title">Выберите навык</h2>
            <div id="infoType" class="info-type">Наведите или нажмите на сектор колеса</div>

        </div>
    </div>
<script src="script.js"></script>
