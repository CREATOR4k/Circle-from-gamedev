<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heroes V Skill Wheel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wheel-container">
        <!-- Левая панель информации -->
        <div class="info-panel">
            <h2 id="infoTitle">Колесо умений</h2>
            <div id="infoRequirements" class="requirements-badge"></div>
            <p id="infoDescription">Выберите фракцию и активируйте навыки. Изучение продвинутых умений требует открытия их базовых зависимостей.</p>
        </div>

        <!-- Зона колеса -->
        <div class="wheel-wrapper">
            <div class="faction-selector">
                <button class="faction-btn active" data-faction="haven">🛡️ Орден Порядка</button>
                <button class="faction-btn" data-faction="inferno">🔥 Инферно</button>
            </div>

            <div class="wheel" id="skillWheel">
                <!-- Контейнер для динамических линий связей -->
                <svg class="wheel-lines" id="wheelLines"></svg>

                <!-- Центр -->
                <div class="center-hub">
                    <img src="images/factions/haven.png" alt="Фракция" id="factionLogo">
                </div>
                
                <!-- Кольца (теперь чисто виртуальные для разметки) -->
                <div class="ring ring-1" id="ring1"></div>
                <div class="ring ring-2" id="ring2"></div>
                <div class="ring ring-3" id="ring3"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
