<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Произвольный выбор круга</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
        }

        /* Главное окно выбора (круг) */
        .main-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 2rem;
            margin-bottom: 25px;
            transition: background-color 0.3s ease, transform 0.2s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        /* Текст описания */
        .description {
            font-size: 1.1rem;
            color: #555;
            text-align: center;
            margin-bottom: 25px;
            min-height: 50px;
            display: flex;
            align-items: center;
        }

        /* Выпадающий список для произвольного выбора */
        .select-box {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: white;
            color: #333;
            cursor: pointer;
            outline: none;
            font-weight: 500;
            transition: border-color 0.2s;
        }

        .select-box:focus {
            border-color: #666;
        }
    </style>
</head>
<body>

    <h1>Окно произвольного выбора</h1>

    <div class="card">
        <!-- Интерактивный круг -->
        <div class="main-circle" id="circle">1</div>
        
        <!-- Описание -->
        <div class="description" id="text">Вариант 1: Красный круг. Отличный старт!</div>
        
        <!-- Элемент произвольного выбора -->
        <select class="select-box" id="selector" onchange="changeOption()">
            <option value="0">Вариант 1 (Красный)</option>
            <option value="1">Вариант 2 (Желтый)</option>
            <option value="2">Вариант 3 (Зеленый)</option>
            <option value="3">Вариант 4 (Синий)</option>
            <option value="4">Вариант 5 (Фиолетовый)</option>
            <option value="5">Вариант 6 (Розовый)</option>
            <option value="6">Вариант 7 (Бирюзовый)</option>
            <option value="7">Вариант 8 (Оранжевый)</option>
        </select>
    </div>

    <script>
        // База данных вариантов
        const data = [
            { id: 1, color: "#ff595e", text: "Вариант 1: Красный круг. Отличный старт!" },
            { id: 2, color: "#ffca3a", text: "Вариант 2: Желтый круг. Солнечный выбор!" },
            { id: 3, color: "#8ac926", text: "Вариант 3: Зеленый круг. Время для роста и гармонии." },
            { id: 4, color: "#1982c4", text: "Вариант 4: Синий круг. Спокойствие и уверенность." },
            { id: 5, color: "#6a4c93", text: "Вариант 5: Фиолетовый круг. Выбор творческих людей." },
            { id: 6, color: "#f72585", text: "Вариант 6: Розовый круг. Ярко и эмоционально!" },
            { id: 7, color: "#72efdd", text: "Вариант 7: Бирюзовый круг. Свежий взгляд на вещи." },
            { id: 8, color: "#f77f00", text: "Вариант 8: Оранжевый круг. Энергия бьет ключом!" }
        ];

        const circleEl = document.getElementById('circle');
        const textEl = document.getElementById('text');
        const selectorEl = document.getElementById('selector');

        // Установка начального состояния
        circleEl.style.backgroundColor = data[0].color;

        function changeOption() {
            // Получаем индекс выбранного элемента в списке
            const selectedIndex = selectorEl.value;
            const currentData = data[selectedIndex];

            // Анимация быстрой пульсации при смене
            circleEl.style.transform = 'scale(0.85)';
            
            setTimeout(() => {
                // Меняем контент на выбранный пользователем
                circleEl.innerText = currentData.id;
                circleEl.style.backgroundColor = currentData.color;
                textEl.innerText = currentData.text;
                circleEl.style.transform = 'scale(1)';
            }, 100);
        }
    </script>
</body>
</html>
